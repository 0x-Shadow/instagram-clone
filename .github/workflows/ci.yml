name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  expo-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npx tsc --noEmit

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on known-leaked placeholders
        run: |
          ! git grep -n "AIzaSyATgIePHiOXnqlzUN4rRyyaPw4CTWH7yWA" -- . || exit 1
          ! git grep -n "Rrt9iMYACnqGK" -- . || exit 1
          ! git grep -n "MYAPP_RELEASE_STORE_PASSWORD=vucms" -- . || exit 1
          echo "No known secrets found."
