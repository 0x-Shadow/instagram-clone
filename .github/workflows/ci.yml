name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  expo-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npx tsc --noEmit

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on known-leaked secrets
        # NOTE: the patterns below live in this file, so exclude it from its
        # own scan — otherwise grep always matches itself.
        run: |
          if git grep -n "AIzaSyATgIePHiOXnqlzUN4rRyyaPw4CTWH7yWA" -- . ':!.github/workflows/ci.yml'; then
            echo "LEAKED Firebase key found"; exit 1
          fi
          if git grep -n "Rrt9iMYACnqGK" -- . ':!.github/workflows/ci.yml'; then
            echo "LEAKED Mapbox token found"; exit 1
          fi
          if git grep -n "MYAPP_RELEASE_STORE_PASSWORD=vucms" -- . ':!.github/workflows/ci.yml'; then
            echo "LEAKED keystore password found"; exit 1
          fi
          echo "No known secrets found."
